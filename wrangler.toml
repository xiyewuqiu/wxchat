name = "wxchat"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# 静态资源配置 - 托管 Vite 构建产物
# SPA 路由回退到 index.html，由前端路由接管
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "wxchat"
database_id = "b58dde57-d777-459f-a6b3-ae4de9c16368"

# R2 存储桶绑定
[[r2_buckets]]
binding = "R2"
bucket_name = "wxchat"

# 环境变量配置（用于鉴权）
[vars]
# 访问密码（明文，直接在Cloudflare Workers控制台配置）
ACCESS_PASSWORD = "wxchat2024"
# JWT密钥（用于会话管理）
JWT_SECRET = "your-super-secret-jwt-key-change-this-in-production"
# 会话过期时间（小时）
SESSION_EXPIRE_HOURS = "24"
# 最大登录尝试次数
MAX_LOGIN_ATTEMPTS = "5"